<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Shopping cart -->
  <rect x="150" y="180" width="300" height="150" rx="20" fill="#E2E8F0"/>
  <rect x="170" y="330" width="260" height="20" rx="10" fill="#CBD5E0"/>
  
  <!-- Wheels -->
  <circle cx="200" cy="360" r="15" fill="#2D3748"/>
  <circle cx="400" cy="360" r="15" fill="#2D3748"/>
  
  <!-- Cart handle -->
  <rect x="420" y="150" width="20" height="80" rx="10" fill="#4A5568"/>
  
  <!-- Grocery items in cart -->
  <!-- Bread -->
  <rect x="180" y="200" width="80" height="40" rx="5" fill="#F6E05E"/>
  <!-- Milk carton -->
  <rect x="270" y="190" width="50" height="80" rx="5" fill="#FFFFFF"/>
  <rect x="280" y="200" width="30" height="20" rx="2" fill="#3182CE"/>
  <!-- Apple -->
  <circle cx="370" cy="220" r="25" fill="#F56565"/>
  <rect x="365" y="180" width="10" height="20" rx="5" fill="#68D391"/>
  
  <!-- Grocery bag -->
  <path d="M450 250 L500 250 L520 350 L430 350 L450 250Z" fill="#F6AD55"/>
  <path d="M450 250 L500 250 L490 270 L460 270 L450 250Z" fill="#ED8936"/>
  
  <!-- Vegetables peeking out of bag -->
  <circle cx="460" cy="260" r="15" fill="#68D391"/>
  <circle cx="490" cy="260" r="15" fill="#F56565"/>
  <rect x="470" y="240" width="10" height="30" rx="5" fill="#805AD5"/>
  
  <!-- Company name -->
  <text x="300" y="100" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle" fill="#F87171">Groceryease</text>
  <text x="300" y="130" font-family="Arial" font-size="16" text-anchor="middle" fill="#4A5568">Fresh Delivery to Your Door</text>
</svg>

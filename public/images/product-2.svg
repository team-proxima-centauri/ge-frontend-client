<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Cheddar Cheese -->
  <rect width="200" height="200" fill="white"/>
  
  <!-- Cheese Block -->
  <rect x="50" y="60" width="100" height="80" rx="5" fill="#F6E05E"/>
  
  <!-- Cheese Texture -->
  <circle cx="70" cy="80" r="3" fill="#F0B429"/>
  <circle cx="90" cy="70" r="2" fill="#F0B429"/>
  <circle cx="110" cy="90" r="3" fill="#F0B429"/>
  <circle cx="130" cy="75" r="2" fill="#F0B429"/>
  <circle cx="65" cy="100" r="2" fill="#F0B429"/>
  <circle cx="85" cy="110" r="3" fill="#F0B429"/>
  <circle cx="105" cy="120" r="2" fill="#F0B429"/>
  <circle cx="125" cy="105" r="3" fill="#F0B429"/>
  
  <!-- Packaging -->
  <rect x="45" y="55" width="110" height="90" rx="5" fill="none" stroke="#E2E8F0" stroke-width="2"/>
  <rect x="45" y="55" width="110" height="20" rx="5" fill="#F0B429"/>
  <text x="100" y="70" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="white">CHEDDAR</text>
  
  <!-- Text -->
  <text x="100" y="170" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#1F2937">Cheddar Cheese</text>
</svg>

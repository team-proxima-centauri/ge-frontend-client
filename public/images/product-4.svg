<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Munchitos Chips -->
  <rect width="200" height="200" fill="white"/>
  
  <!-- Chips Bag -->
  <path d="M60 40 L140 40 L150 150 L50 150 Z" fill="#FBD38D"/>
  <path d="M60 40 L140 40 L135 60 L65 60 Z" fill="#F6AD55"/>
  
  <!-- Logo -->
  <rect x="70" y="70" width="60" height="30" rx="15" fill="#F6AD55"/>
  <text x="100" y="90" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#FFFFFF">MUNCHITOS</text>
  
  <!-- Chip Illustrations -->
  <ellipse cx="80" cy="110" rx="10" ry="5" fill="#F6AD55" transform="rotate(30 80 110)"/>
  <ellipse cx="100" cy="120" rx="10" ry="5" fill="#F6AD55" transform="rotate(-20 100 120)"/>
  <ellipse cx="120" cy="105" rx="10" ry="5" fill="#F6AD55" transform="rotate(10 120 105)"/>
  
  <!-- Product Name -->
  <text x="100" y="180" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#1F2937">Munchitos Chips</text>
</svg>

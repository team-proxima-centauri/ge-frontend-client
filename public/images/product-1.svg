<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Nescafe Gold Coffee -->
  <rect width="200" height="200" fill="white"/>
  
  <!-- Coffee Jar -->
  <rect x="60" y="40" width="80" height="120" rx="5" fill="#D4A76A"/>
  <rect x="65" y="45" width="70" height="110" rx="3" fill="#8B4513"/>
  
  <!-- Label -->
  <rect x="70" y="60" width="60" height="80" rx="2" fill="#F6E05E"/>
  <rect x="75" y="70" width="50" height="10" rx="1" fill="#B7791F"/>
  <rect x="75" y="85" width="50" height="5" rx="1" fill="#B7791F"/>
  <rect x="75" y="95" width="50" height="5" rx="1" fill="#B7791F"/>
  <rect x="75" y="105" width="50" height="5" rx="1" fill="#B7791F"/>
  <rect x="75" y="115" width="30" height="15" rx="1" fill="#B7791F"/>
  
  <!-- Lid -->
  <rect x="60" y="30" width="80" height="15" rx="2" fill="#D4A76A"/>
  <rect x="65" y="35" width="70" height="5" rx="1" fill="#8B4513"/>
  
  <!-- Text -->
  <text x="100" y="180" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#1F2937">Nescafe Gold</text>
</svg>
